<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pestañas de Contenido</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div id="pestanas">
        <button data-id="tab-html">HTML</button>
        <button data-id="tab-css">CSS</button>
        <button data-id="tab-js">JavaScript</button>
    </div>

    <div id="contenido">
        <div id="tab-html" class="panel">HTML define la estructura y el contenido de la página.</div>
        <div id="tab-css" class="panel oculto">CSS se encarga del aspecto visual: colores, tipografías y disposición.</div>
        <div id="tab-js" class="panel oculto">JavaScript añade comportamiento e interactividad a la página.</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
